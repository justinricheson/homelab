---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.app.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}
    spec:
      shareProcessNamespace: true
      initContainers:
      - name: prepare-password-file
        image: {{ .Values.deployment.utilityImage.repository }}:{{ .Values.deployment.utilityImage.tag }}
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
        command:
        - /bin/sh
        - -c
        - cp /source/passwordfile /dest/passwordfile && chown 1883:1883 /dest/passwordfile && chmod 0600 /dest/passwordfile
        volumeMounts:
        - name: passwd-source
          mountPath: /source
          readOnly: true
        - name: passwd
          mountPath: /dest
      containers:
      - name: {{ .Values.app.name }}
        image: {{ .Values.deployment.image.repository }}:{{ .Values.deployment.image.tag }}
        ports:
        - containerPort: 1883
        - containerPort: 8883
        volumeMounts:
        - name: config
          mountPath: /mosquitto/config/mosquitto.conf
          subPath: mosquitto.conf
        - name: certs
          mountPath: /mosquitto/certs
          readOnly: true
        - name: passwd
          mountPath: /mosquitto/passwd

      - name: cert-reloader
        image: {{ .Values.deployment.utilityImage.repository }}:{{ .Values.deployment.utilityImage.tag }}
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1883
          runAsGroup: 1883
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          cert_dir=/mosquitto/certs
          previous="$(readlink "$cert_dir/..data" 2>/dev/null || true)"
          echo "Watching for Mosquitto TLS certificate updates"

          while :; do
            sleep 5
            current="$(readlink "$cert_dir/..data" 2>/dev/null || true)"
            [ -n "$current" ] || continue
            [ "$current" = "$previous" ] && continue
            previous="$current"

            echo "Certificate Secret changed; reloading Mosquitto"
            found=false
            for proc in /proc/[0-9]*; do
              [ -r "$proc/comm" ] || continue
              IFS= read -r name < "$proc/comm" || continue
              if [ "$name" = mosquitto ]; then
                kill -HUP "${proc#/proc/}"
                found=true
                break
              fi
            done

            if [ "$found" != true ]; then
              echo "ERROR: Mosquitto process not found" >&2
            fi
          done
        volumeMounts:
        - name: certs
          mountPath: /mosquitto/certs
          readOnly: true

      volumes:
      - name: config
        configMap:
          name: {{ .Values.app.name }}-config
      - name: certs
        secret:
          secretName: wildcard-tls
      - name: passwd
        emptyDir: {}
      - name: passwd-source
        secret:
          secretName: {{ .Values.app.name }}-passwd
          defaultMode: 0400
