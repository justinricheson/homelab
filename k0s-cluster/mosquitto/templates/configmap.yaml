---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.app.name }}-config
  namespace: {{ .Release.Namespace }}
data:
  mosquitto.conf: |
    persistence false
    log_dest stdout

    plugin_load password_file /usr/lib/mosquitto_password_file.so

    listener 1883
    listener_allow_anonymous true

    listener 8883
    listener_allow_anonymous false
    certfile /mosquitto/certs/tls.crt
    keyfile /mosquitto/certs/tls.key
    plugin_use password_file
    plugin_opt_password_file /mosquitto/passwd/passwordfile
